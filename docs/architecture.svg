<svg width="980" height="640" viewBox="0 0 980 640" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#66708a"/>
    </marker>
  </defs>
  <rect width="980" height="640" fill="#ffffff"/>

  <!-- Frontend -->
  <rect x="360" y="24" width="260" height="64" rx="8" fill="#0a0d13"/>
  <text x="490" y="50" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Next.js Frontend</text>
  <text x="490" y="70" text-anchor="middle" font-size="11.5" fill="#96a1b3">React · Tailwind · Redux Toolkit Query</text>

  <line x1="490" y1="88" x2="490" y2="130" stroke="#66708a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="504" y="112" font-size="11" fill="#66708a">REST + SSE</text>

  <!-- Backend -->
  <rect x="330" y="132" width="320" height="70" rx="8" fill="#ff7a33"/>
  <text x="490" y="160" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1a0d05">FastAPI Backend</text>
  <text x="490" y="180" text-anchor="middle" font-size="11.5" fill="#4a2a12">Auth · Projects · IFC ingest · Chat · Recs</text>

  <!-- Branches -->
  <line x1="420" y1="202" x2="140" y2="266" stroke="#66708a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="460" y1="202" x2="330" y2="266" stroke="#66708a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="520" y1="202" x2="650" y2="266" stroke="#66708a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="560" y1="202" x2="840" y2="266" stroke="#66708a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- PostgreSQL -->
  <rect x="40" y="268" width="200" height="66" rx="8" fill="#f5f7fa" stroke="#1f2733" stroke-width="1.2"/>
  <text x="140" y="296" text-anchor="middle" font-size="13" font-weight="600" fill="#0a0d13">PostgreSQL</text>
  <text x="140" y="315" text-anchor="middle" font-size="11" fill="#66708a">users · projects · elements</text>

  <!-- Cloudinary -->
  <rect x="250" y="268" width="180" height="66" rx="8" fill="#f5f7fa" stroke="#1f2733" stroke-width="1.2"/>
  <text x="340" y="296" text-anchor="middle" font-size="13" font-weight="600" fill="#0a0d13">Cloudinary</text>
  <text x="340" y="315" text-anchor="middle" font-size="11" fill="#66708a">raw IFC file storage</text>

  <!-- Redis + Celery -->
  <rect x="550" y="268" width="200" height="66" rx="8" fill="#f5f7fa" stroke="#1f2733" stroke-width="1.2"/>
  <text x="650" y="296" text-anchor="middle" font-size="13" font-weight="600" fill="#0a0d13">Redis + Celery worker</text>
  <text x="650" y="315" text-anchor="middle" font-size="11" fill="#66708a">async IFC parse &amp; energy sim</text>

  <!-- LLM -->
  <rect x="750" y="268" width="190" height="66" rx="8" fill="#f5f7fa" stroke="#1f2733" stroke-width="1.2"/>
  <text x="845" y="296" text-anchor="middle" font-size="13" font-weight="600" fill="#0a0d13">DeepSeek / OpenRouter</text>
  <text x="845" y="315" text-anchor="middle" font-size="11" fill="#66708a">streaming chat completions</text>

  <!-- Worker to IfcOpenShell + EnergyPlus -->
  <line x1="620" y1="334" x2="500" y2="410" stroke="#66708a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="680" y1="334" x2="700" y2="410" stroke="#66708a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="340" y1="334" x2="470" y2="410" stroke="#66708a" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="380" y="368" font-size="10.5" fill="#66708a">download for parsing</text>

  <rect x="370" y="412" width="220" height="64" rx="8" fill="#f5f7fa" stroke="#1f2733" stroke-width="1.2"/>
  <text x="480" y="438" text-anchor="middle" font-size="13" font-weight="600" fill="#0a0d13">IfcOpenShell</text>
  <text x="480" y="457" text-anchor="middle" font-size="11" fill="#66708a">geometry, materials, quantities</text>

  <rect x="610" y="412" width="220" height="64" rx="8" fill="#f5f7fa" stroke="#1f2733" stroke-width="1.2"/>
  <text x="720" y="438" text-anchor="middle" font-size="13" font-weight="600" fill="#0a0d13">Energy engine</text>
  <text x="720" y="457" text-anchor="middle" font-size="11" fill="#66708a">EnergyPlus / ISO 13790 fallback</text>

  <line x1="480" y1="476" x2="480" y2="520" stroke="#66708a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="330" y="522" width="300" height="66" rx="8" fill="#0a0d13"/>
  <text x="480" y="550" text-anchor="middle" font-size="13.5" font-weight="600" fill="#ffffff">Carbon &amp; recommendation engine</text>
  <text x="480" y="570" text-anchor="middle" font-size="11" fill="#96a1b3">writes elements + summary back to Postgres</text>
</svg>
