<svg width="980" height="230" viewBox="0 0 980 230" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#66708a"/>
    </marker>
  </defs>
  <rect width="980" height="230" fill="#ffffff"/>

  <!-- steps -->
  <g font-size="12" fill="#66708a">
    <!-- 1 -->
    <rect x="20" y="70" width="150" height="70" rx="8" fill="#f5f7fa" stroke="#1f2733" stroke-width="1.2"/>
    <text x="95" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#0a0d13">.ifc upload</text>
    <text x="95" y="117" text-anchor="middle">POST /upload-ifc</text>

    <line x1="170" y1="105" x2="212" y2="105" stroke="#66708a" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <!-- 2 -->
    <rect x="214" y="70" width="150" height="70" rx="8" fill="#ff7a33"/>
    <text x="289" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1a0d05">Cloudinary</text>
    <text x="289" y="117" text-anchor="middle" fill="#4a2a12">raw bytes → secure_url</text>

    <line x1="364" y1="105" x2="406" y2="105" stroke="#66708a" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <!-- 3 -->
    <rect x="408" y="70" width="170" height="70" rx="8" fill="#f5f7fa" stroke="#1f2733" stroke-width="1.2"/>
    <text x="493" y="93" text-anchor="middle" font-size="13" font-weight="600" fill="#0a0d13">temp working copy</text>
    <text x="493" y="112" text-anchor="middle">inline: in-memory bytes</text>
    <text x="493" y="128" text-anchor="middle">Celery: downloaded from URL</text>

    <line x1="578" y1="105" x2="620" y2="105" stroke="#66708a" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <!-- 4 -->
    <rect x="622" y="70" width="150" height="70" rx="8" fill="#f5f7fa" stroke="#1f2733" stroke-width="1.2"/>
    <text x="697" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#0a0d13">IfcOpenShell</text>
    <text x="697" y="117" text-anchor="middle">parse elements + geometry</text>

    <line x1="772" y1="105" x2="814" y2="105" stroke="#66708a" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <!-- 5 -->
    <rect x="816" y="70" width="145" height="70" rx="8" fill="#0a0d13"/>
    <text x="888" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Postgres</text>
    <text x="888" y="117" text-anchor="middle" fill="#96a1b3">elements + carbon totals</text>
  </g>

  <text x="490" y="200" text-anchor="middle" font-size="11.5" fill="#66708a">Temp files are deleted immediately after parsing — Cloudinary is the only persistent copy of the model.</text>
</svg>
